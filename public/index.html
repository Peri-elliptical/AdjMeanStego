<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>AdjMeanStego</title>
        <style>
            .form-wrapper {
                width: max-content;
            }
            .row-container {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
        </style>
    </head> 
    <body>
        <h1 style="text-align: center;">Adjacent Mean Steganography</h1>

        Enter the Cover Image: <input type="file" id="input_image" name="input_image" accept="image/*" required><br><br>

        <div class="form-wrapper">
            Secret Message:<br>
            <textarea style="resize:none" id="message" name="message" rows="4" cols="50" required></textarea><br>
            
            <div class="row-container">
                <div>
                    Embedding depth:
                    <select name="EmbDepth" id="EmbDepth">
                        <option value="1">1</option>
                        <option value="2" selected>2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                    </select>
                </div>

                <div>
                    <input type="checkbox" id="string_rep" name="string_rep" value="String Repetition">
                    <label for="string_rep">String Repetition</label>
                </div>
            </div>
        </div>
        <br>
        <button onclick="submitForm()">Embed Message</button><br><br>

        Stego Image: <br><br>
        <p id="output"></p><br><br>
        <img id="result_image" src="" style="max-width: 100%;">
        <script src="script.js"></script>
    </body>
</html>
